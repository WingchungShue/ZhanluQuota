name: build-ipa

on:
  workflow_dispatch:   # 手动触发（GitHub 网页 Actions 页点 Run）

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for LiveContainer sideload)
        run: |
          set -e
          xcodebuild -scheme ZhanluQuota \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZhanluQuota.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          set -e
          mkdir -p build/Payload
          cp -r build/ZhanluQuota.xcarchive/Products/Applications/ZhanluQuota.app build/Payload/
          cd build
          zip -r ZhanluQuota.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhanluQuota-ipa
          path: build/ZhanluQuota.ipa
          retention-days: 30
